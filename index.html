<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Salalah Project Progress Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    --bg: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    --panel: rgba(255, 255, 255, 0.5);
    --panel2: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(247,250,252,0.45) 100%);
    --border: rgba(255, 255, 255, 0.3);
    --text: #1a202c;
    --muted: #4a5568;
    --accent: #667eea;
    --accent2: #764ba2;
    --outline: rgba(102, 126, 234, 0.3);
    --fs: clamp(16px, 1.2vw + 12px, 22px);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.16);
    --shadow-xl: 0 16px 48px rgba(0,0,0,0.2);
  }
  *{ box-sizing:border-box }
  html, body { height:100%; }
  body{
    margin:0; color:var(--text);
    background: var(--bg);
    background-attachment: fixed;
    font: var(--fs)/1.55 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-y:auto; overflow-x:hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: 
      radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 40% 20%, rgba(245, 87, 108, 0.05) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  header{
    height:72px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:0 24px; background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    font-weight: 800; font-size: 24px; color: #1a202c; position: relative; z-index: 10;
  }
  header span {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    font-size: 26px; letter-spacing: -0.5px;
  }
  .app{ height: calc(100vh - 72px); min-height: calc(100dvh - 72px);
    display:grid; gap:20px; padding:20px; grid-template-columns: 1.7fr 1fr; overflow:hidden; position: relative; z-index: 1; }
  .hidden{ visibility:hidden; }
  .card{
    background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 20px; box-shadow: var(--shadow-xl); padding: 20px;
    display:flex; flex-direction:column; min-width:0; backdrop-filter: blur(10px);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15); }
  .card h4{ margin: 0 0 16px 0; font-weight: 800; font-size: 26px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.3px; }
  #mapAssets{ flex:1 1 auto; border-radius: 16px; overflow:hidden; min-height:0; position:relative;
    box-shadow: var(--shadow-lg); border: 2px solid rgba(255, 255, 255, 0.3); }
  .dock{
    position:absolute; z-index:5; top:16px; left:16px; width: 380px; max-height: calc(100% - 32px);
    background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 20px; box-shadow: var(--shadow-xl);
    overflow:hidden; display:flex; flex-direction:column; transition: transform 0.3s ease;
  }
  .dock:hover { transform: scale(1.01); }
  .dock.collapsed{ width:auto; max-width: 50vw; height:auto; max-height:none; border-radius:999px; padding:8px 12px; gap:8px; }
  .dock.collapsed .dock-tools, .dock.collapsed #dockList{ display:none }
  .dock.collapsed .dock-header{ border:none; padding:0 }
  .dock-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px);
  }
  .dock-title{ display:flex; align-items:center; gap:10px; font-weight:800; font-size: 18px; }
  .dock-title i { color: #667eea; }
  .dock-title small{ color:var(--muted); font-weight:700; font-size: 14px;
    background: rgba(102, 126, 234, 0.1); padding: 4px 8px; border-radius: 12px; }
  .dock-actions .icon-btn{
    border: 1px solid rgba(102, 126, 234, 0.2); background: rgba(255, 255, 255, 0.8);
    border-radius: 10px; padding: 8px 10px; cursor:pointer; font-weight:700; transition: all 0.2s ease; color: #667eea;
  }
  .dock-actions .icon-btn:hover { background: rgba(102, 126, 234, 0.1); border-color: #667eea; transform: scale(1.05); }
  .dock-tools{ display:flex; flex-direction:column; gap:10px; padding:14px 16px; background: rgba(255, 255, 255, 0.5); }
  #dockSearch{
    border: 1px solid rgba(102, 126, 234, 0.2); background: rgba(255, 255, 255, 0.9);
    border-radius: 12px; padding: 10px 14px; font-weight:600; width:100%; transition: all 0.2s ease;
  }
  #dockSearch:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); background: #fff; }
  .chips{ display:flex; gap:8px; overflow:auto; -webkit-overflow-scrolling: touch; padding-bottom:4px; scrollbar-width: thin; }
  .chip{
    border: 1px solid rgba(102, 126, 234, 0.2); background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(247,250,252,0.9) 100%);
    color:var(--text); padding: 8px 14px; border-radius: 20px; font-weight:700; white-space:nowrap; cursor:pointer;
    transition: all 0.2s ease; font-size: 15px;
  }
  .chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: rgba(102, 126, 234, 0.4); }
  .chip.ghost{ background: rgba(255, 255, 255, 0.7); border-color: rgba(102, 126, 234, 0.15); }
  .chip.active{ background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: transparent;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); transform: translateY(-1px); }
  .dock-list{
    padding: 10px; overflow:auto; background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(247,250,252,0.6) 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.3); scrollbar-width: thin;
  }
  .layer-card{
    display:grid; grid-template-columns: 32px 1fr auto auto; align-items:center; gap:10px;
    background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(102, 126, 234, 0.15);
    border-radius: 14px; padding: 12px 14px; margin: 8px 6px; box-shadow: var(--shadow-sm); transition: all 0.2s ease;
  }
  .layer-card:hover { transform: translateX(4px); box-shadow: var(--shadow-md); border-color: rgba(102, 126, 234, 0.3); background: #fff; }
  .layer-card .stripe{ width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .layer-card .name{ font-weight:900; line-height:1.2 }
  .layer-card .meta{ color:var(--muted); font-weight:700; font-size:1em }
  .layer-card .tools{ display:flex; gap:6px; }
  .icon-btn.small{
    border: 1px solid rgba(102, 126, 234, 0.2); background: rgba(255, 255, 255, 0.9);
    border-radius: 10px; padding: 6px 10px; cursor:pointer; font-weight:700; transition: all 0.2s ease;
    color: #667eea; font-size: 14px;
  }
  .icon-btn.small:hover { background: rgba(102, 126, 234, 0.1); border-color: #667eea; transform: scale(1.05); }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ position:absolute; opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; background:#e9edff; border:1px solid var(--border); border-radius:999px; transition:.15s;
  }
  .slider:before{
    content:""; position:absolute; height:18px; width:18px; left:3px; top:50%;
    transform:translateY(-50%); background:white; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.15); transition:.15s;
  }
  .switch input:checked + .slider{ background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: #667eea; }
  .switch input:checked + .slider:before{ transform:translate(18px,-50%); box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4); }
  .kpis{ display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 16px; }
  .kpi{ background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(247,250,252,0.5) 100%);
    border: 1px solid rgba(255, 255, 255, 0.35); padding: 16px; border-radius: 16px; box-shadow: var(--shadow-md);
    transition: all 0.3s ease; position: relative; overflow: hidden; backdrop-filter: blur(10px); }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
  .kpi:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .kpi .label{ color:var(--muted); font-size:12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi .value{ font-size: 28px; font-weight:800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  #mapProgress{ height: 40%; border-radius: 16px; overflow:hidden; min-height:0;
    box-shadow: var(--shadow-lg); border: 2px solid rgba(255, 255, 255, 0.3); }
  .charts{ display:grid; grid-template-columns: 0.8fr 1.2fr; gap: 16px; height: calc(60% - 16px); min-height:0; overflow:hidden; margin-top: 16px; }
  .chartbox{
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(247,250,252,0.5) 100%);
    border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 18px; padding: 16px;
    position:relative; overflow:hidden; min-height:0; box-shadow: var(--shadow-md); transition: all 0.3s ease; backdrop-filter: blur(10px);
  }
  .chartbox .refresh-btn{ position:absolute; right:12px; top:12px; padding:6px 10px; font-weight:900; }
  .chartbox:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .chartbox canvas{ display:block; width:100% !important; height:100% !important; }
  #barChartFilter {
    border: 1px solid rgba(102, 126, 234, 0.2) !important;
    background: rgba(255, 255, 255, 0.95) !important; border-radius: 12px !important;
    padding: 10px 14px !important; font-weight: 700 !important; cursor: pointer !important; min-width: 200px !important;
    transition: all 0.2s ease; box-shadow: var(--shadow-sm);
  }
  #barChartFilter:focus {
    outline: none; border-color: #667eea !important; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
  }
  th.tbl-sort { cursor:pointer; user-select:none; padding:10px 12px; text-align:left; font-weight:900; color:#3a3f6e; border-bottom:1px solid var(--border); background:#f7f9ff }
  td.tbl-cell { padding:8px 12px; border-bottom:1px solid #f0f3ff; color:#1c2546; font-size:14px }
  tr:nth-child(even) td.tbl-cell { background:#fcfdff; }
  .btn{ border:1px solid var(--border); background:#fff; padding:8px 12px; border-radius:10px; font-weight:800; cursor:pointer; }
  .btn:active{ transform: translateY(1px); }
  .maplibregl-ctrl-scale { margin: 8px; }
  @media (max-width: 1200px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: auto; min-height: calc(100vh - 64px); }
    #mapAssets{ min-height: 0; height: 100%; }
    #mapProgress{ height: 40%; min-height: 0; }
    .charts{ height: calc(60% - 10px); min-height: 0; }
    .card{ padding:10px; min-height: 0; }
    .dock{ width: min(92vw, 420px); }
  }
</style>
</head>
<body>
<header>
  <span>Salalah Project Progress</span>
</header>

<div class="app hidden">
  <section class="card" style="grid-column:1;">
    <h4>Assets Map</h4>
    <div id="mapAssets">
      <div id="layerDock" class="dock collapsed">
        <div class="dock-header">
          <div class="dock-title">
            <i class="fas fa-map" style="font-size:20px;"></i>
            <strong>Asset</strong>
            <small id="dockMeta">0 active</small>
          </div>
          <div class="dock-actions">
            <button id="dockCollapse" class="icon-btn" title="Collapse">▾</button>
          </div>
        </div>
        <div class="dock-tools">
          <input id="dockSearch" type="search" placeholder="Search assets…" />
          <div id="groupChips" class="chips"></div>
          <div class="quick">
            <button id="dockAllOn"  class="chip ghost" type="button">Show all</button>
            <button id="dockAllOff" class="chip ghost" type="button">Hide all</button>
          </div>
        </div>
        <div id="dockList" class="dock-list"></div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">Assets</div><div class="value" id="kpiAssets">0</div></div>
      <div class="kpi"><div class="label">Total Assets</div><div class="value" id="kpiTotalAssets">0</div></div>
      <div class="kpi"><div class="label">% Uncovered Area</div><div class="value" id="kpiUncovered">0%</div></div>
    </div>
  </section>

  <section class="card" style="grid-column:2;">
    <h4>Progress Coverage</h4>
    <div id="mapProgress"></div>

    <div class="charts">
      <div class="chartbox">
        <canvas id="areaChart"></canvas>
        <button id="refreshArea" class="icon-btn small refresh-btn" title="Refresh coverage">↻</button>
      </div>
      <div class="chartbox" id="barBox">
        <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:8px;">
          <select id="barChartFilter">
            <option value="__ALL__">All Groups</option>
          </select>
        </div>
        <canvas id="assetBar"></canvas>
      </div>
    </div>
  </section>
</div>

<script>
window.addEventListener('error', e=>{
  const b=document.createElement('div');
  b.style.cssText='position:fixed;inset:12px;z-index:999999;background:#fff;color:#1a2242;border:1px solid #e6ebff;border-radius:12px;padding:14px;box-shadow:0 10px 20px rgba(0,0,0,.12);';
  b.innerHTML=`<b>JS Error</b><br>${e.message}<br><pre style="white-space:pre-wrap">${e.filename}:${e.lineno}:${e.colno}</pre>`;
  document.body.appendChild(b);
}, true);
</script>

<script>
const CENTER = [54.1, 17.02];
const baseStyle = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'; // token-free light
const PROCESSED_URL = 'data/Processed.geojson';
const REMAIN_URL    = 'data/Remaining.geojson';

async function loadJSON(u){ const r=await fetch(encodeURI(u),{cache:'no-store'}); if(!r.ok) throw new Error(u); return r.json(); }
function fitToFC(map, fc){ try{ const bb=turf.bbox(fc); if (bb.every(Number.isFinite)) map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:30,duration:0}); }catch{} }

const mapAssets = new maplibregl.Map({ container:'mapAssets', style:baseStyle, center:CENTER, zoom:11, minZoom:5, maxZoom:19 });
mapAssets.addControl(new maplibregl.NavigationControl(), 'top-right');
mapAssets.addControl(new maplibregl.ScaleControl({ maxWidth:160, unit:'metric' }), 'bottom-left');
mapAssets.setMaxBounds([[36,-5],[66,30]]);

const mapProgress = new maplibregl.Map({ container:'mapProgress', style:baseStyle, center:CENTER, zoom:11, minZoom:5, maxZoom:19 });
mapProgress.addControl(new maplibregl.NavigationControl(), 'top-right');
mapProgress.addControl(new maplibregl.ScaleControl({ maxWidth:160, unit:'metric' }), 'bottom-left');
mapProgress.setMaxBounds([[36,-5],[66,30]]);

// BELT-AND-SUSPENDERS: never allow coverage on left map
function purgeCoverageOnLeft(){
  ['processed','processed_assets','remaining','remaining_assets'].forEach(id=>{
    if (mapAssets.getLayer(id)) mapAssets.removeLayer(id);
    if (mapAssets.getSource(id)) mapAssets.removeSource(id);
    if (mapAssets.getLayer(id+'_outline')) mapAssets.removeLayer(id+'_outline');
  });
}
['load','styledata','sourcedata','idle'].forEach(evt => mapAssets.on(evt, purgeCoverageOnLeft));

// Charts setup
Chart.register(ChartDataLabels);
Chart.defaults.color = '#1a202c';
Chart.defaults.font.size = 16;
Chart.defaults.font.family = "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif";
Chart.defaults.font.weight = '700';
Chart.defaults.plugins.legend.labels.color = '#4a5568';
Chart.defaults.plugins.legend.labels.font = { size: 15, weight:'700' };
const areaChart = new Chart(document.getElementById('areaChart').getContext('2d'), {
  type:'doughnut',
  data:{ labels:['Processed km²','Remaining km²'], datasets:[{ data:[0,0], backgroundColor:['#71b084','#bca3c2'], borderWidth:0 }] },
  options:{ maintainAspectRatio:false, cutout:'38%', plugins:{ legend:{ position:'bottom' },
    datalabels:{ color:'#fff', font:{ weight:'1000', size:16 }, formatter:v => (typeof v==='number'? v.toFixed(2)+' km²':v) } } }
});
const assetBar = new Chart(document.getElementById('assetBar').getContext('2d'), {
  type:'bar',
  data:{ labels:[], datasets:[{ label:'Features', data:[], backgroundColor:[], borderRadius:10 }] },
  options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{ legend:{ display:false } },
    scales:{ x:{ beginAtZero:true }, y:{ ticks:{ autoSkip:false } } } }
});

(async function boot(){
  await Promise.all([
    new Promise(res => mapAssets.once('load', res)),
    new Promise(res => mapProgress.once('load', res))
  ]);

  // Load coverage and add to RIGHT map only
  let processed={type:'FeatureCollection',features:[]}, remaining={type:'FeatureCollection',features:[]};
  try{ processed = await loadJSON(PROCESSED_URL); }catch{}
  try{ remaining = await loadJSON(REMAIN_URL); }catch{}

  if (processed.features?.length){
    if (mapProgress.getSource('processed')) { try{ mapProgress.removeLayer('processed'); }catch{} mapProgress.removeSource('processed'); }
    mapProgress.addSource('processed', { type:'geojson', data:processed });
    mapProgress.addLayer({ id:'processed', type:'fill', source:'processed',
      paint:{ 'fill-color':'#71b084', 'fill-opacity':0.45, 'fill-outline-color':'#94a3b8' }});
  }
  if (remaining.features?.length){
    if (mapProgress.getSource('remaining')) { try{ mapProgress.removeLayer('remaining'); }catch{} mapProgress.removeSource('remaining'); }
    mapProgress.addSource('remaining', { type:'geojson', data:remaining });
    mapProgress.addLayer({ id:'remaining', type:'fill', source:'remaining',
      paint:{ 'fill-color':'#bca3c2', 'fill-opacity':0.40, 'fill-outline-color':'#94a3b8' }});
  }

  const allCov = { type:'FeatureCollection', features:[...(processed.features||[]), ...(remaining.features||[])] };
  if (allCov.features.length) fitToFC(mapProgress, allCov);

  // IMPORTANT: ensure left map stays clean
  purgeCoverageOnLeft();

  // --- your existing assets loading code goes here (only adds assets to mapAssets) ---
  // If you have a manifest-driven loader, keep using it; just make sure it never calls addLayer/addSource with ids:
  // 'processed', 'processed_assets', 'remaining', 'remaining_assets'.

  // KPIs (simple example using coverage areas)
  let p=0, r=0;
  try { processed.features.forEach(f=>{ if (/Polygon/i.test(f.geometry?.type)) p+=turf.area(f)/1e6; }); }catch{}
  try { remaining.features.forEach(f=>{ if (/Polygon/i.test(f.geometry?.type)) r+=turf.area(f)/1e6; }); }catch{}
  const total = p+r;
  document.getElementById('kpiUncovered').textContent = total ? Math.round((r/total)*100)+'%' : '0%';
  areaChart.data.datasets[0].data = [+(p.toFixed(2)), +(r.toFixed(2))];
  areaChart.update();

  document.querySelector('.app')?.classList.remove('hidden');
})();
function debounce(fn, ms=120){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function doResize(){ try { mapAssets.resize(); }catch{} try { mapProgress.resize(); }catch{} try { areaChart.resize(); }catch{} try { assetBar.resize(); }catch{} }
window.addEventListener('resize', debounce(doResize, 150));
window.addEventListener('orientationchange', doResize);
const ro = new ResizeObserver(debounce(doResize, 60));
['mapAssets','mapProgress','areaChart','assetBar'].forEach(id=>{
  const el = document.getElementById(id);
  ro.observe(id==='areaChart'||id==='assetBar' ? el?.parentElement : el);
});
</script>
</body>
</html>
